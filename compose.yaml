name: bsc-apm-env

services:
  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=eclass
    command:
      - --innodb-buffer-pool-size=120M
      - --innodb_flush_log_at_trx_commit=2
      - --wait-timeout=86400
      - --max_allowed_packet=67108864
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD -e 'show databases;' | grep -q $$MYSQL_DATABASE || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  eclass:
    image: bsc-apm/openeclass:dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - config_data:/var/www/html/config
      - courses_data:/var/www/html/courses
      - video_data:/var/www/html/video
      - ./seed:/srv/seed:ro
    environment:
      - MYSQL_LOCATION=db
      - MYSQL_ROOT_USER=root
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DB=eclass
      - BASE_URL=http://localhost
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - PHP_MAX_UPLOAD=256M
      - DEFAULT_LANGUAGE=el

  sso:
    image: bsc-apm/mock-cas:dev
    ports:
      - "8082:8082"
    volumes:
      - ./certs:/etc/mock-cas/certs:ro
    environment:
      - MOCK_CAS_PORT=8082
      - MOCK_CAS_CONFIG=/etc/mock-cas/cas-config.json

volumes:
  config_data:
  courses_data:
  video_data:
  db_data:
