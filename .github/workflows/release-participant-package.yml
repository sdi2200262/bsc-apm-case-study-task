name: Build participant package release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern \
            latexmk

      - name: Build participant package
        run: make participant-package

      - name: Smoke-test the zip
        run: |
          mkdir -p /tmp/smoke
          unzip -q release/participant-package.zip -d /tmp/smoke
          test -f /tmp/smoke/participant-package/participant-guide-cc.pdf
          test -f /tmp/smoke/participant-package/task/PRD.md
          test -f /tmp/smoke/participant-package/task/PROMPT.md
          test -f /tmp/smoke/participant-package/task/README.txt
          test -f /tmp/smoke/participant-package/.claude/skills/bsc-apm-study-helper/SKILL.md
          test -f /tmp/smoke/participant-package/.claude/skills/bsc-apm-study-helper/references/host-setup.md
          test -f /tmp/smoke/participant-package/.claude/skills/bsc-apm-study-helper/references/in-vm-setup.md
          test -f /tmp/smoke/participant-package/.claude/skills/bsc-apm-study-helper/references/session.md
          test -f /tmp/smoke/participant-package/.claude/skills/bsc-apm-study-helper/references/between-sessions.md
          test -f /tmp/smoke/participant-package/.claude/skills/bsc-apm-study-helper/references/cleanup.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=participant-package
          TITLE="Participant package"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --latest=true \
            release/participant-package.zip
